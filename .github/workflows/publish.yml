name: Publish - Imagens Docker

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Owner em minusculo
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build e push - Backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/biblioteca-backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/biblioteca-backend:latest

      - name: Build e push - Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/biblioteca-frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/biblioteca-frontend:latest