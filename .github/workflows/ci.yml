name: CI - Sistema da Biblioteca

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-test-smoke:
    name: "Matrix: backend-test-Smoke"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: [app.test.js]
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npx jest tests/${{ matrix.file }}

  frontend-test:
    name: "Frontend: ${{ matrix.file }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file:
          - cadastro.behavior.test.js
          - livros.behavior.test.js
          - livros.test.js
          - login.behavior.test.js
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npx jest tests/${{ matrix.file }}

  docker:
    name: Build das Imagens Docker
    runs-on: ubuntu-latest
    needs:
      - backend-test-smoke
      - frontend-test
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build da imagem Backend
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: false
          tags: biblioteca-backend:ci
      - name: Build da imagem Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: false
          tags: biblioteca-frontend:ci
