name: CI - Sistema da Biblioteca

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend-test:
    name: Testes do Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

  frontend-test:
    name: Testes do Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

  docker:
    name: Build das Imagens Docker
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem Backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          push: false
          tags: biblioteca-backend:ci

      - name: Build da imagem Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          push: false
          tags: biblioteca-frontend:ci